# 平台场景目录 (课程作者契约 v1)
# ======================================
# 用途: 课程 agent 据此生成实验/作业, **无需读源码**。
# 原则: 只收录"实测通过"的场景; 未验证的明确标注 status: unverified, 避免误导。
#
# 字段说明:
#   id           场景唯一名 (课程引用它)
#   level        难度层级 L0(入门) .. L6(进阶), 供阶梯排课
#   model        启动机型 (run_simulation.sh 第二参数; stack: none 时忽略)
#   world        世界 (第三参数; stack: none 时忽略)
#   command      完整启动命令, 可多行 (每行一个独立进程)
#   stack        auto=先跑 run_simulation.sh; none=命令自己起整套仿真
#   namespaces   需要采样的 PX4 命名空间 (多机场景列多个)
#   odom_topics  需要采样的里程计话题 {别名: 话题}
#   duration     观察窗口(秒)
#   metrics      判定指标: name/threshold/unit/how —— 这是"检测标准"的可执行形态
#   evidence     历史实测证据 (供对照, 不是自动判定依据)
#   pitfalls     已知坑 (课程里应作为"故障实验室"素材)
#   status       verified=实测通过 / partial / unverified=未验证 / broken

meta:
  version: 1
  updated: '2026-11-27'
  note: >-
    指标阈值取自实际飞行数据并留了余量; 自动判定由 tools/grade.py 执行,
    默认要求 N 次运行中 >=2/3 通过 (单次通过不算 PASS, 避免幸存者偏差)。

worlds:
  default:      {desc: 空场, 用途: 控制入门/调试, status: verified}
  aruco:        {desc: 地面 ArUco 靶标, 用途: 视觉检测/精准降落/多机, status: verified}
  walls:        {desc: 结构化墙体, 用途: SLAM/避障, status: verified}
  e7_obstacles: {desc: 小方块障碍群, 用途: 避障规划, status: verified}
  baylands:     {desc: 户外纹理地形, 用途: VIO/视觉, status: verified}
  windy:        {desc: 有风扰动, 用途: 鲁棒性, status: unverified}
  lawn:         {desc: 草地, 用途: 视景多样性, status: verified}
  indoor1:      {desc: 室内场景, 用途: 室内 SLAM, status: broken, note: 'gz 加载旧 Fuel 资产 SIGABRT'}

models:
  gz_x500:               {desc: 多旋翼基线, sensors: [imu], status: verified}
  gz_x500_mono_cam:      {desc: 前置单目相机, sensors: [imu, camera], status: verified}
  gz_x500_depth:         {desc: OakD 深度相机, sensors: [imu, camera, depth, points], status: verified}
  gz_x500_mono_cam_down: {desc: 下视相机(自建机架4013), sensors: [imu, camera], status: verified}
  gz_x500_lidar_2d:      {desc: 2D 激光(自建机架4012), sensors: [imu, lidar2d], status: verified}
  gz_x500_lidar_3d:      {desc: 16线3D激光(自建机架4014), sensors: [imu, lidar3d], status: verified}
  gz_standard_vtol:      {desc: 复合翼, sensors: [imu], status: verified}
  gz_rc_cessna:          {desc: 固定翼, sensors: [imu], status: unverified}

scenarios:
  # ---------------------------------------------------------------- L0 控制入门
  - id: ctrl.takeoff_hover_land
    level: L0
    title: 起飞-悬停-降落
    model: gz_x500
    world: default
    stack: auto
    namespaces: ['/x500_0']
    duration: 95
    command: |
      ros2 run drone_sim offboard_demo --ros-args -p px4_ns:=/x500_0 -p takeoff_altitude:=5.0 -p circle_duration:=0.0
    metrics:
      - {name: 起飞高度误差, threshold: '< 0.4', unit: m, how: 'max(-z) 与目标高度之差'}
      - {name: 全程耗时, threshold: '< 75', unit: s, how: '解锁到上锁'}
      - {name: 结束状态, threshold: disarmed, unit: '-', how: 'arming_state==1'}
    evidence: logs/grade/demo8.md
    pitfalls: [QoS_RELIABLE_死锁, 解锁前未预流setpoint, 相对话题vs命名空间]
    status: verified

  # ---------------------------------------------------------------- L1 航点
  - id: ctrl.waypoint_square
    level: L1
    title: 正方形航点任务 + RViz 可视化
    model: gz_x500
    world: aruco
    stack: auto
    namespaces: ['/x500_0']
    duration: 110
    command: |
      ros2 launch drone_sim waypoint_mission.launch.py prefix:=/x500_0 mission:=square speed:=1.0
    metrics:
      - {name: 到点误差, threshold: '< 0.5', unit: m, how: '各航点最小接近距离的最大值'}
      - {name: 命中航点数, threshold: '>= 4', unit: 个, how: 'min|pos-wp| < 0.5m 的航点数'}
      - {name: 结束状态, threshold: disarmed, unit: '-', how: 'arming_state==1'}
    evidence: logs/smoke_wp2.log, screenshots/08_e2_waypoint_mission.png
    pitfalls: [EKF原点重置导致贴地爬行]
    status: verified

  # ---------------------------------------------------------------- L2 视觉
  - id: vision.yolo_detect
    level: L2
    title: YOLO 目标检测节点
    model: gz_x500_mono_cam
    world: baylands
    stack: auto
    namespaces: ['/x500_mono_cam_0']
    duration: 30
    command: |
      bash scripts/run_yolo.sh /x500_mono_cam_0/camera/image_raw
    metrics:
      - {name: 启动成功, threshold: '>= 1', unit: '-', how: '日志含"YOLO 检测启动"'}
      - {name: 无异常退出, threshold: '>= 1', unit: '-', how: '日志无 Traceback/ModuleNotFound'}
    evidence: screenshots/18_e8_yolo_test.jpg
    pitfalls: [系统python无ultralytics需conda+LD_PRELOAD]
    status: verified

  # ---------------------------------------------------------------- L3 精准降落
  - id: vision.aruco_precision_landing
    level: L3
    title: ArUco 识别 + 精准降落
    model: gz_x500_mono_cam_down
    world: aruco
    stack: auto
    namespaces: ['/x500_mono_cam_down_0']
    node_log_file: '{RUN_LOG}.nodelog'
    duration: 150
    command: |
      ros2 run drone_sim aruco_precision_landing --ros-args -p camera_ns:=/x500_mono_cam_down_0 -p log_file:={RUN_LOG}.nodelog
    metrics:
      - {name: 落点偏差, threshold: '< 0.15', unit: m, how: '结束时水平位置与靶标(世界原点)距离'}
      - {name: 最终对齐, threshold: '>= 1', unit: '-', how: '日志出现"最终对齐完成/统计居中达标"'}
      - {name: 结束状态, threshold: disarmed, unit: '-', how: 'arming_state==1'}
    evidence: logs/e8_debug.log, screenshots/16_e8_precision_landed.png
    pitfalls: [图像到世界映射符号, 偏航旋转, EKF原点重置误导定位, 低空极限环]
    status: verified

  # ---------------------------------------------------------------- L4 SLAM
  - id: slam.lio_odometry
    level: L4
    title: 3D 激光惯性里程计 (Point-LIO)
    model: gz_x500_lidar_3d
    world: walls
    stack: auto
    namespaces: ['/x500_lidar_3d_0']
    odom_topics: {lio: /odom}
    duration: 100
    command: |
      ros2 launch drone_sim point_lio.launch.py
      ros2 launch drone_sim waypoint_mission.launch.py prefix:=/x500_lidar_3d_0 mission:=square speed:=1.0
    metrics:
      - {name: 高度误差, threshold: '< 0.2', unit: m, how: 'LIO z 与 gz 真值 z 的中位偏差'}
      - {name: 里程计频率, threshold: '> 5', unit: Hz, how: 'odom 消息数/时长'}
      - {name: 轨迹跨度, threshold: '> 2', unit: m, how: '真值轨迹水平包络'}
    evidence: logs/e5_flight_v6.log, screenshots/19_e5_lio_map.png
    pitfalls: [点云含inf导致发散, QoS_BEST_EFFORT连不上Point-LIO, 点云缺ring/time]
    status: verified

  # ---------------------------------------------------------------- L5 规划/任务/安全
  - id: plan.obstacle_avoidance
    level: L5
    title: 障碍场自动绕行到达目标
    model: gz_x500_depth
    world: e7_obstacles
    stack: auto
    namespaces: ['/x500_depth_0']
    duration: 110
    goal: [6.0, 0.0, 1.2]
    arrive_tol: 0.8
    obstacles: [[2.6, 0.85], [4.0, -0.85]]
    command: |
      ros2 run drone_sim planner_reactive --ros-args -p px4_ns:=/x500_depth_0 -p target_x:=6.0 -p target_y:=0.0 -p target_z:=1.2
    metrics:
      - {name: 最近接近距离, threshold: '< 0.8', unit: m, how: '轨迹到目标的最近距离'}
      - {name: 结束误差, threshold: '< 1.5', unit: m, how: '结束时与目标的距离'}
      - {name: 障碍最小距离, threshold: '> 0.8', unit: m, how: '轨迹与障碍中心最近距离'}
    evidence: logs/e7_reactive.log, screenshots/27_e7_reactive_planner.png
    pitfalls: [PX4局部系与gz世界系失配, 深度相机地面回波误判, 无自标定则飞反]
    status: verified

  - id: mission.behavior_tree
    level: L5
    title: 行为树任务编排 (XML 可配置)
    model: gz_x500
    world: aruco
    stack: auto
    namespaces: ['/x500_0']
    node_log_file: '{RUN_LOG}.nodelog'
    duration: 90
    command: |
      ros2 run drone_sim bt_mission --ros-args -p px4_ns:=/x500_0 -p log_file:={RUN_LOG}.nodelog -p mission_xml:=$(ros2 pkg prefix drone_sim)/share/drone_sim/config/mission_bt_square.xml
    metrics:
      - {name: 根节点状态, threshold: '>= 1', unit: '-', how: '日志出现"任务结束: SUCCESS"'}
      - {name: 到达航点数, threshold: '>= 3', unit: 个, how: '位姿进入航点 0.6m 内的个数'}
      - {name: 结束状态, threshold: disarmed, unit: '-', how: 'arming_state==1'}
    evidence: logs/e10_bt_square.log, screenshots/24_e10_bt_mission.png
    pitfalls: [py_trees装饰器反复initialise, 多实例并行互相干扰, 容差过紧]
    status: verified

  - id: safety.geofence
    level: L5
    title: 地理围栏触发返航
    model: gz_x500
    world: walls
    stack: auto
    namespaces: ['/x500_0']
    node_log_file: '{RUN_LOG}.nodelog'
    duration: 75
    command: |
      ros2 run drone_sim safety_supervisor --ros-args -p px4_ns:=/x500_0 -p max_radius:=2.5 -p log_file:={RUN_LOG}.nodelog
      ros2 launch drone_sim waypoint_mission.launch.py prefix:=/x500_0 mission:=square
    metrics:
      - {name: 围栏事件, threshold: '>= 1', unit: '-', how: '日志含"超出水平围栏"等'}
      - {name: 误报, threshold: '< 1', unit: 次, how: '非围栏类安全事件数'}
    evidence: logs/e12_safety.log
    pitfalls: [倾角不能用速度比近似(会误报88°), 需用vehicle_attitude四元数]
    status: verified

  # ---------------------------------------------------------------- L6 多机/集群/VTOL
  - id: multi.formation
    level: L6
    title: 双机编队跟随
    model: gz_x500
    world: aruco
    stack: none
    namespaces: ['/x500_0', '/x500_1']
    node_log_index: 2               # 第 3 条命令 = formation_follower, 读它自报的编队误差
    duration: 75
    command: |
      ros2 launch drone_sim multi_vehicle.launch.py num:=2 world:=aruco px4_dir:=/develop/IDEA/Drone_ros2/PX4-Autopilot
      ros2 launch drone_sim waypoint_mission.launch.py prefix:=/x500_0 mission:=square
      ros2 run drone_sim formation_follower --ros-args -p leader_ns:=/x500_0 -p follower_ns:=/x500_1 -p target_system:=2
    metrics:
      - {name: 队形误差, threshold: '< 0.6', unit: m, how: '跟随者自报"编队误差"稳态中位数 ⚠️自报口径, 待加独立几何校验'}
      - {name: 双机同时起飞, threshold: '>= 1', unit: '-', how: '两机解锁时刻相差 <8s'}
    evidence: logs/e3_leader_v3.log, logs/e3_follower_v3.log, screenshots/13_e3_formation.png
    pitfalls: [target_system必须=实例号+1, parameters.bson冲突需每实例独立工作目录]
    status: verified

  - id: swarm.cross_3uav
    level: L6
    title: 3 机交叉飞行互不碰撞
    model: gz_x500
    world: aruco
    stack: none
    namespaces: ['/x500_0', '/x500_1', '/x500_2']
    duration: 110
    arrive_tol: 0.8
    goals:
      /x500_0: [3.0, 0.0, 2.5]
      /x500_1: [0.0, 4.0, 3.2]
      /x500_2: [-3.0, 0.0, 3.9]
    command: |
      ros2 launch drone_sim swarm_cross.launch.py
    metrics:
      - {name: 最小间距, threshold: '> 1.0', unit: m, how: '任意两机最近距离'}
      - {name: 全部到达, threshold: '>= 3', unit: 架, how: '各机与目标距离 < arrive_tol'}
    evidence: logs/e9_x500_0.log, screenshots/26_e9_swarm_cross.png
    pitfalls: [同层交叉间距过小(0.76m), 需高度分层]
    status: verified

  - id: vtol.transition
    level: L6
    title: VTOL 垂直起飞→固定翼→转回→垂直降落
    model: gz_standard_vtol
    world: walls
    stack: auto
    namespaces: ['/standard_vtol_0']
    duration: 110
    command: |
      ros2 run drone_sim vtol_demo --ros-args -p px4_ns:=/standard_vtol_0
    metrics:
      - {name: 固定翼段空速, threshold: '> 15', unit: m/s, how: '水平速度峰值'}
      - {name: 垂直起飞高度, threshold: '> 15', unit: m, how: '真值高度峰值'}
      - {name: 结束状态, threshold: disarmed, unit: '-', how: 'arming_state==1'}
    evidence: logs/e11_vtol.log, screenshots/25_e11_vtol_fw_flight.png
    pitfalls: [必须先切POSCTL再发过渡, 否则空速不变]
    status: verified

  # ---------------------------------------------------------------- 研究型挑战 (不作作业)
  - id: vio.vins_mono
    level: L4
    title: VINS-Fusion 单目视觉惯性里程计
    model: gz_x500_mono_cam
    world: baylands
    stack: auto
    namespaces: ['/x500_mono_cam_0']
    odom_topics: {vins: /vins_estimator/odometry}
    duration: 60
    command: |
      ros2 run vins vins_node $(ros2 pkg prefix drone_sim)/share/drone_sim/config/vins_mono_imu.yaml
    metrics:
      - {name: 里程计输出频率, threshold: '> 5', unit: Hz, how: '/vins_estimator/odometry 消息数/时长'}
    evidence: logs/e6_vins5.log
    pitfalls: [视觉惯性对齐失败misalign, LK金字塔断言崩溃]
    status: unverified
