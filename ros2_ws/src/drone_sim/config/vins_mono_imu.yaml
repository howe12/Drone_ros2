%YAML:1.0

# E6: gz 仿真 x500_mono_cam (前视单目 1280x960, hfov 1.74) + IMU(base_link)
imu: 1
num_of_cam: 1

imu_topic: "/x500_mono_cam_0/imu"
image0_topic: "/x500_mono_cam_0/camera/image_raw"
output_path: "/develop/IDEA/Drone_ros2/logs/vins_output/"

cam0_calib: "vins_cam0_pinhole.yaml"
image_width: 1280
image_height: 960

# 外参: 相机在 base_link 前方 (0.12, 0.03, 0.242), 朝向机体 +x
# 光心系(x右 y下 z前) <- 机体系(x前 y左 z上)
estimate_extrinsic: 1
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0, 0, 1, 0.12,
          -1, 0, 0, 0.03,
          0, -1, 0, 0.242,
          0, 0, 0, 1]

multiple_thread: 1
use_gpu: 0
use_gpu_acc_flow: 0

# 优化参数
max_cnt: 300
min_dist: 10
freq: 0
F_threshold: 1.0
show_track: 0
flow_back: 1

# 优化
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 15.0

# IMU 噪声 (仿真: 小噪声)
acc_n: 0.08
gyr_n: 0.004
acc_w: 0.00004
gyr_w: 0.00002
g_norm: 9.81007

# 时延
estimate_td: 0
td: 0.0

# 卷帘
rolling_shutter: 0
rolling_shutter_tr: 0

# 输出
pose_graph: 0
save_image: 0
