# YOLO 检测演示专用航线（低空 + 悬停 + 慢速通过）
#
# 场景目标位置（yolo_targets.sdf）:
#   行人: (3, ±1.5) 和 (9, 0)
#   车辆: (6, -3) / (6, 0) / (6, 3)
#
# 设计意图:
#   1. 从出生点后退到 x=-3 再看过去 -> 行人在前方 6m, 不会被机头遮住
#   2. 悬停在 (-3, 0) 高度 2.5m 共 14s -> 画面里人物约 2m 远处、占画面下部 1/3,
#      持续被检出; 悬停点必须离目标有足够距离, 否则目标落在视野下方甚至头顶正下方
#   3. 再以 0.7m/s 慢速前飞经过车辆 -> 框持续存在
#
# 教训: 第一次把悬停点设在 x=2, 距行人(x=3)只有 1m, 2m 高度下人在画面下方之外,
#       结果 15 秒里只有起飞阶段检出了人。
waypoints:
  - {x: -3.0, y: 0.0, z: -2.5, hold: 14.0}   # 悬停在行人前方约 6m
  - {x: 16.0, y: 0.0, z: -2.5, hold: 0.0}    # 慢速通过 (行人 x=3/9, 车 x=6)
speed: 0.7
